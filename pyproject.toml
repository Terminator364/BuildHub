[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "buildhub"
version = "0.1.0"
description = "Generic build orchestration, evidence, recovery, and publication engine"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
buildhub = "buildhub.cli:main"

[tool.setuptools.packages.find]
include = ["buildhub*"]
