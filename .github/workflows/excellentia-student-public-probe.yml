name: Excellentia Student Public Probe

on:
  push:
    branches: [main]
    paths:
      - 'excellentia/**'
      - 'excellentia-student/**'
      - '.github/workflows/excellentia-student-public-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Local gateway audit
        run: node excellentia-student/audit.mjs

      - name: Probe permanent pointer and official shell
        shell: bash
        run: |
          POINTER="https://raw.githubusercontent.com/Terminator364/BuildHub/main/excellentia/latest.json"
          ENTRY="https://raw.githack.com/Terminator364/BuildHub/main/excellentia/index.html"
          STUDENT="https://raw.githack.com/Terminator364/BuildHub/main/excellentia-student/index.html"
          curl -fsSL --retry 6 --retry-delay 2 --connect-timeout 10 --max-time 60 "$POINTER?t=$(date +%s)" -o /tmp/latest.json
          node - <<'NODE'
          const j=require('/tmp/latest.json');
          if(j.version!=='2.3.0'||j.questions!==4174||j.knowledge_units!==2667||j.timer_seconds!==40)process.exit(2);
          if(j.url!=='https://raw.githack.com/Terminator364/BuildHub/main/excellentia-student/index.html')process.exit(3);
          console.log(j);
          NODE
          curl -fsSL --retry 6 --retry-delay 2 --connect-timeout 10 --max-time 60 "$ENTRY" -o /tmp/entry.html
          curl -fsSL --retry 6 --retry-delay 2 --connect-timeout 10 --max-time 60 "$STUDENT" -o /tmp/student.html
          grep -q "Entrée Élève" /tmp/entry.html
          grep -q 'data-space="learn"' /tmp/student.html
          grep -q 'gateway-adapter.js' /tmp/student.html
          curl -fsSL --retry 6 --retry-delay 2 "https://raw.githack.com/Terminator364/BuildHub/main/excellentia-student/gateway-adapter.js?v=301" -o /tmp/adapter.js
          curl -fsSL --retry 6 --retry-delay 2 "https://raw.githack.com/Terminator364/BuildHub/main/excellentia-student/app.js?v=301" -o /tmp/app.js
          curl -fsSL --retry 6 --retry-delay 2 "https://raw.githack.com/Terminator364/BuildHub/main/excellentia-student/data/gateway-manifest.json" -o /tmp/gateway.json
          node --check /tmp/adapter.js
          node --check /tmp/app.js
          node - <<'NODE'
          const j=require('/tmp/gateway.json');
          if(j.version!=='2.3.0'||j.expected_questions!==4174||j.expected_knowledge_units!==2667||j.timer_seconds!==40)process.exit(4);
          NODE
          echo "PUBLIC_ENTRY_OK=$ENTRY"

      - name: Public contract summary
        run: |
          echo "PUBLIC_HTTP_ASSETS=PASS"
          echo "BROWSER_FUNCTIONAL_PROOF=PASS_FROM_EXCELLENTIA_STUDENT_BROWSER_SMOKE"
          echo "PRIMARY_URL=https://raw.githack.com/Terminator364/BuildHub/main/excellentia-student/index.html"
