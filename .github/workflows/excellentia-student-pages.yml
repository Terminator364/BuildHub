name: Excellentia Student Gateway

on:
  pull_request:
    paths:
      - 'excellentia-student/**'
      - '.github/workflows/excellentia-student-pages.yml'
  push:
    branches: [main]
    paths:
      - 'excellentia-student/**'
      - '.github/workflows/excellentia-student-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: excellentia-student-pages
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: Gateway audit
        run: |
          node --check excellentia-student/app.js
          node excellentia-student/audit.mjs
          node excellentia-student/gateway-audit.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: audit
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Student Gateway
        uses: actions/upload-pages-artifact@v3
        with:
          path: excellentia-student
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
