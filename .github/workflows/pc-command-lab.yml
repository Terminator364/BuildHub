name: PC Command Lab

on:
  pull_request:
    paths:
      - 'labs/pc-command/*.ps1'
      - 'labs/pc-command/v5/**'
      - 'labs/pc-command/PCCONNECT.md'
      - 'labs/pc-command/PROTOCOL_V2.md'
      - 'labs/pc-command/feed-v3.json'
      - 'labs/tests/test-pc-command.ps1'
      - 'labs/tests/test-adaptive-progress.ps1'
      - 'labs/tests/test-pc-command-v5.ps1'
      - 'labs/tests/PCCommand.Static.Tests.ps1'
      - '.github/workflows/pc-command-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pc-command-lab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install PowerShell quality gates
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -AllowClobber
          Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck -AllowClobber
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $r = Invoke-ScriptAnalyzer -Path ./labs/pc-command/v5 -Recurse -Severity Error
          $r | Format-Table
          if ($r) { throw "PSScriptAnalyzer errors detected" }
      - name: Parse and validate PC Command
        shell: pwsh
        run: |
          ./labs/tests/test-pc-command.ps1
          ./labs/tests/test-adaptive-progress.ps1
          ./labs/tests/test-pc-command-v5.ps1
      - name: Pester smoke assertions
        shell: pwsh
        run: |
          $result = Invoke-Pester -Path ./labs/tests/PCCommand.Static.Tests.ps1 -PassThru
          if ($result.FailedCount -gt 0) { throw "Pester failures: $($result.FailedCount)" }
