name: Excellentia Student Gateway Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'excellentia-student/**'
      - '.github/workflows/excellentia-student-gateway-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'excellentia-student/**'
      - '.github/workflows/excellentia-student-gateway-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Audit public corpus mirror
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const root='excellentia-student/data';
          const m=JSON.parse(fs.readFileSync(path.join(root,'gateway-manifest.json'),'utf8'));
          let all=[];
          for(const f of m.question_files){
            const p=path.join(root,f);
            if(!fs.existsSync(p)) throw new Error('Missing '+f);
            const a=JSON.parse(fs.readFileSync(p,'utf8'));
            if(!Array.isArray(a)) throw new Error('Not array '+f);
            all.push(...a);
          }
          const ids=new Set(all.map(q=>q.id));
          const kids=new Set(all.map(q=>q.knowledge_id).filter(Boolean));
          const bad=all.filter(q=>!q.id||!Array.isArray(q.choices)||q.choices.length<4||!Number.isInteger(q.answer)||q.answer<0||q.answer>=q.choices.length);
          console.log(JSON.stringify({files:m.question_files.length,questions:all.length,ids:ids.size,knowledge_units:kids.size,bad:bad.length},null,2));
          if(all.length!==4174) throw new Error('Expected 4174 questions, got '+all.length);
          if(ids.size!==4174) throw new Error('Duplicate/missing IDs');
          if(kids.size!==2667) throw new Error('Expected 2667 knowledge units, got '+kids.size);
          if(bad.length) throw new Error('Malformed questions: '+bad.length);
          NODE

      - name: Static shell checks
        shell: bash
        run: |
          grep -q "Plateforme Élève" excellentia-student/index.html
          grep -q "40000" excellentia-student/app.js || grep -q "40" excellentia-student/app.js
          grep -q "serviceWorker.register" excellentia-student/app.js
          grep -q "offline_first" excellentia-student/data/gateway-manifest.json

      - name: External CDN smoke
        shell: bash
        run: |
          REF="${{ github.event.pull_request.head.sha }}"
          if [ -z "$REF" ]; then REF="$GITHUB_SHA"; fi
          BASE="https://cdn.jsdelivr.net/gh/$GITHUB_REPOSITORY@$REF/excellentia-student"
          curl -fL --retry 6 --retry-delay 10 --retry-all-errors "$BASE/index.html" -o /tmp/index.html
          curl -fL --retry 6 --retry-delay 10 --retry-all-errors "$BASE/app.js?v=230" -o /tmp/app.js
          curl -fL --retry 6 --retry-delay 10 --retry-all-errors "$BASE/data/gateway-manifest.json" -o /tmp/gateway.json
          grep -q "Plateforme Élève" /tmp/index.html
          node -e "const m=require('/tmp/gateway.json'); if(m.expected_questions!==4174||m.timer_seconds!==40) process.exit(1)"
          echo "CDN_URL=$BASE/index.html"

      - name: Alternate HTML gateway smoke
        shell: bash
        run: |
          REF="${{ github.event.pull_request.head.sha }}"
          if [ -z "$REF" ]; then REF="$GITHUB_SHA"; fi
          URL="https://raw.githack.com/$GITHUB_REPOSITORY/$REF/excellentia-student/index.html"
          curl -fL --retry 4 --retry-delay 10 --retry-all-errors "$URL" -o /tmp/githack.html
          grep -q "Plateforme Élève" /tmp/githack.html
          echo "ALT_URL=$URL"
