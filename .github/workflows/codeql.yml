name: BuildHub CodeQL

on:
  push:
    branches: ["main"]
    paths:
      - "buildhub/**"
      - "webview-shell/**"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: buildhub-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended

      - name: Analyze Python
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"

  cpp:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended

      - name: Restore pinned WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -Version 1.0.4191.47 -OutputDirectory packages -NonInteractive

      - name: Build native shell under CodeQL tracing
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          if not defined VSROOT (echo Visual Studio C++ toolchain not found & exit /b 2)
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          if not exist out mkdir out
          cl.exe /nologo /std:c++20 /O1 /EHsc /MT /DNOMINMAX /DWIN32_LEAN_AND_MEAN webview-shell\src\main.cpp /Ipackages\Microsoft.Web.WebView2.1.0.4191.47\build\native\include /Fe:out\BuildHubWebViewShell.exe /link /SUBSYSTEM:WINDOWS user32.lib gdi32.lib ole32.lib shell32.lib shlwapi.lib advapi32.lib version.lib oleaut32.lib packages\Microsoft.Web.WebView2.1.0.4191.47\build\native\x64\WebView2LoaderStatic.lib

      - name: Analyze C++
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:c-cpp"
