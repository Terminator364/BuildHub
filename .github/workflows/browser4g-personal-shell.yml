name: Browser4G Personal Shell Bench

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'webview-shell/**'
      - '.github/workflows/browser4g-personal-shell.yml'

permissions:
  contents: read

jobs:
  bench:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Restore WebView2 SDK
        shell: pwsh
        run: nuget install Microsoft.Web.WebView2 -Version 1.0.4191.47 -OutputDirectory packages -NonInteractive
      - name: Compile personal shell
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          if not exist out mkdir out
          cl.exe /nologo /utf-8 /std:c++20 /O1 /EHsc /MT /DNOMINMAX /DWIN32_LEAN_AND_MEAN webview-shell\src\main.cpp /Ipackages\Microsoft.Web.WebView2.1.0.4191.47\build\native\include /Fe:out\BuildHubWebViewShell.exe /link /SUBSYSTEM:WINDOWS user32.lib gdi32.lib ole32.lib shell32.lib shlwapi.lib advapi32.lib version.lib oleaut32.lib psapi.lib dbghelp.lib packages\Microsoft.Web.WebView2.1.0.4191.47\build\native\x64\WebView2LoaderStatic.lib
      - name: Resource prefilter
        shell: pwsh
        run: |
          @"
          [app]
          title=Browser4G Personal
          app_id=Browser4GPersonalBench
          home=https://chatgpt.com/
          "@ | Set-Content out\browser4g.ini -Encoding ascii
          $p=Start-Process .\out\BuildHubWebViewShell.exe -PassThru
          Start-Sleep 30
          $all=Get-CimInstance Win32_Process
          $ids=New-Object 'System.Collections.Generic.List[int]'
          $ids.Add($p.Id)
          $changed=$true
          while($changed){
            $changed=$false
            foreach($x in $all){
              if($ids.Contains([int]$x.ParentProcessId)-and-not$ids.Contains([int]$x.ProcessId)){
                $ids.Add([int]$x.ProcessId);$changed=$true
              }
            }
          }
          $ps=Get-Process -Id @($ids) -ErrorAction SilentlyContinue
          $ram=($ps|Measure-Object WorkingSet64 -Sum).Sum
          $private=($ps|Measure-Object PrivateMemorySize64 -Sum).Sum
          $cpu=($ps|Measure-Object CPU -Sum).Sum
          $r=[ordered]@{browser='personal-webview2-shell';pages=1;process_count=@($ps).Count;working_set_mb=[math]::Round($ram/1MB,1);private_mb=[math]::Round($private/1MB,1);cpu_seconds=[math]::Round($cpu,2);note='Single physical WebView2 slot; experimental candidate'}
          Write-Host ('BROWSER4G_PERSONAL='+($r|ConvertTo-Json -Compress))
          $ps|Stop-Process -Force -ErrorAction SilentlyContinue
