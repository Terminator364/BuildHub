name: Build generic WebView shell

on:
  workflow_dispatch:
  push:
    paths:
      - 'webview-shell/**'
      - '.github/workflows/build-webview-shell.yml'
  pull_request:
    paths:
      - 'webview-shell/**'
      - '.github/workflows/build-webview-shell.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore pinned WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -Version 1.0.4191.47 -OutputDirectory packages -NonInteractive

      - name: Compile x64 native shell
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in ('"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath') do set "VSROOT=%%i"
          if not defined VSROOT exit /b 10
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          if not exist out mkdir out
          cl.exe /nologo /std:c++20 /O1 /EHsc /MT /DUNICODE /D_UNICODE /DWIN32_LEAN_AND_MEAN webview-shell\src\main.cpp /Ipackages\Microsoft.Web.WebView2.1.0.4191.47\build\native\include /Fe:out\BuildHubWebViewShell.exe /link /SUBSYSTEM:WINDOWS user32.lib gdi32.lib ole32.lib shell32.lib shlwapi.lib advapi32.lib version.lib oleaut32.lib packages\Microsoft.Web.WebView2.1.0.4191.47\build\native\x64\WebView2LoaderStatic.lib

      - name: Hash and manifest
        shell: pwsh
        run: |
          $hash = (Get-FileHash out\BuildHubWebViewShell.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            component = 'BuildHubWebViewShell'
            architecture = 'x64'
            webview2_sdk = '1.0.4191.47'
            sha256 = $hash
            commit = '${{ github.sha }}'
          }
          $manifest | ConvertTo-Json | Set-Content -Encoding utf8NoBOM out\build-manifest.json
          Get-Item out\BuildHubWebViewShell.exe | Format-List Name,Length
          Get-Content out\build-manifest.json

      - name: Upload generic shell artifact
        uses: actions/upload-artifact@v4
        with:
          name: buildhub-webview-shell-x64
          path: out/
          if-no-files-found: error
          retention-days: 30
