name: Excellentia Student Gateway

on:
  pull_request:
    branches: [main]
    paths:
      - 'excellentia-student/**'
      - '.github/workflows/excellentia-student-gateway.yml'
  push:
    branches: [main]
    paths:
      - 'excellentia-student/**'
      - '.github/workflows/excellentia-student-gateway.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: excellentia-student-pages
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check excellentia-student/app.js
          grep -q "40000" excellentia-student/app.js
          grep -q "timer_seconds.*40" excellentia-student/data/gateway-manifest.json
      - name: Corpus integrity
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const root='excellentia-student/data';
          const m=JSON.parse(fs.readFileSync(path.join(root,'gateway-manifest.json'),'utf8'));
          let all=[],bad=[];
          for(const f of m.question_files){
            const p=path.join(root,f);
            if(!fs.existsSync(p)){bad.push('missing:'+f);continue}
            const a=JSON.parse(fs.readFileSync(p,'utf8'));
            if(!Array.isArray(a)){bad.push('not_array:'+f);continue}
            all.push(...a);
          }
          const ids=new Set(),kids=new Set(),dup=[];
          for(const q of all){
            if(!q||!q.id||!Array.isArray(q.choices)||q.choices.length<4||!Number.isInteger(q.answer)||q.answer<0||q.answer>=q.choices.length) bad.push('invalid:'+String(q&&q.id));
            if(ids.has(q.id))dup.push(q.id); else ids.add(q.id);
            if(q.knowledge_id)kids.add(q.knowledge_id);
          }
          const out={questions:all.length,knowledge_units:kids.size,ids:ids.size,duplicates:dup.length,bad:bad.length,files:m.question_files.length};
          console.log(JSON.stringify(out,null,2));
          if(all.length!==m.expected_questions) throw new Error('QUESTION_COUNT '+all.length+' != '+m.expected_questions);
          if(kids.size!==m.expected_knowledge_units) throw new Error('KNOWLEDGE_COUNT '+kids.size+' != '+m.expected_knowledge_units);
          if(dup.length||bad.length) throw new Error('CORPUS_INTEGRITY');
          NODE
      - name: Offline shell integrity
        run: |
          test -f excellentia-student/index.html
          test -f excellentia-student/sw.js
          test -f excellentia-student/manifest.webmanifest
          grep -q "excellentia-student-v230" excellentia-student/sw.js

  cdn-smoke:
    if: github.event_name != 'pull_request'
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - name: Verify public CDN gateway
        shell: bash
        run: |
          BASE="https://cdn.jsdelivr.net/gh/Terminator364/BuildHub@main/excellentia-student"
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/index.html" -o /tmp/index.html
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/app.js?v=230" -o /tmp/app.js
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/data/gateway-manifest.json" -o /tmp/gateway-manifest.json
          grep -q "EXCELLENTIA STUDY HUB" /tmp/index.html
          grep -q "const S=" /tmp/app.js
          grep -q '"expected_questions": 4174' /tmp/gateway-manifest.json
          curl -fsSI --retry 5 --retry-delay 2 "$BASE/index.html" -o /tmp/headers.txt
          tr -d '\r' < /tmp/headers.txt | grep -i '^content-type:'
          echo "GATEWAY_URL=$BASE/index.html"

  deploy-pages:
    if: github.event_name != 'pull_request' && false
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - run: echo "GitHub Pages initial enablement requires an administrative token; CDN gateway is active meanwhile."
