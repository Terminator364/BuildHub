name: Excellentia Student Gateway

on:
  push:
    branches: [main]
    paths:
      - 'excellentia/**'
      - 'excellentia-student/**'
      - '.github/workflows/excellentia-student-gateway.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: excellentia-student-gateway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gateway integrity
        run: |
          node --check excellentia-student/app.js
          node excellentia-student/audit.mjs
          grep -q "40000" excellentia-student/app.js
          grep -q "localStorage" excellentia-student/app.js
          grep -q "serviceWorker" excellentia-student/app.js

  browser-smoke:
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - name: Verify permanent QR route
        shell: bash
        run: |
          URL="https://html-preview.github.io/?url=https://github.com/Terminator364/BuildHub/blob/main/excellentia/index.html"
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless --disable-gpu --no-sandbox --virtual-time-budget=60000 --dump-dom "$URL" > /tmp/dom.html
          grep -q "EXCELLENTIA STUDY HUB" /tmp/dom.html
          grep -q "Culture générale" /tmp/dom.html
          grep -Eq "4[ . ]?174|4174" /tmp/dom.html
          grep -Eq "2[ . ]?667|2667" /tmp/dom.html
          echo "QR_ROUTE_OK=$URL"
