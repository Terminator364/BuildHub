name: Excellentia Student Gateway

on:
  pull_request:
    paths:
      - 'excellentia-student/**'
      - '.github/workflows/excellentia-student-gateway.yml'
  push:
    branches: [main]
    paths:
      - 'excellentia-student/**'
      - '.github/workflows/excellentia-student-gateway.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: Syntax
        run: node --check excellentia-student/app.js && node --check excellentia-student/gateway-audit.mjs
      - name: Corpus parity
        run: node excellentia-student/gateway-audit.mjs
