name: buildhub-ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buildhub-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Excellentia public browser proof
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          URL="https://html-preview.github.io/?url=https://github.com/Terminator364/BuildHub/blob/main/excellentia-student/index.html"
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          "$CHROME" --headless --disable-gpu --no-sandbox --virtual-time-budget=45000 --dump-dom "$URL" > /tmp/excellentia-dom.html
          grep -q "EXCELLENTIA STUDY HUB" /tmp/excellentia-dom.html
          grep -q "Culture générale" /tmp/excellentia-dom.html
          grep -Eq "4[ . ]?174|4174" /tmp/excellentia-dom.html
          grep -Eq "2[ . ]?667|2667" /tmp/excellentia-dom.html
          echo "EXCELLENTIA_PUBLIC_BROWSER_OK=$URL"
          ENTRY="https://html-preview.github.io/?url=https://github.com/Terminator364/BuildHub/blob/main/excellentia/index.html"
          "$CHROME" --headless --disable-gpu --no-sandbox --virtual-time-budget=60000 --dump-dom "$ENTRY" > /tmp/excellentia-entry-dom.html
          grep -q "EXCELLENTIA STUDY HUB" /tmp/excellentia-entry-dom.html
          grep -q "Culture générale" /tmp/excellentia-entry-dom.html
          grep -Eq "4[ . ]?174|4174" /tmp/excellentia-entry-dom.html
          grep -Eq "2[ . ]?667|2667" /tmp/excellentia-entry-dom.html
          echo "EXCELLENTIA_PERMANENT_QR_OK=$ENTRY"

      - name: Public repository boundary audit
        run: python tools/public_audit.py .

      - name: Error-ledger validation
        run: python tools/check_ledger.py .project-memory/ERROR_LEDGER.jsonl

      - name: Compile
        run: python -m compileall -q buildhub tests tools

      - name: Regression and fault-injection tests
        run: python -m unittest discover -s tests -v

      - name: Doctor evidence
        run: python -m buildhub.cli doctor --json ci-doctor.json

      - name: Deterministic package smoke test
        run: >
          python -m buildhub.cli package --root . --output ci-buildhub.zip
          README.md pyproject.toml buildhub/__init__.py buildhub/cli.py
          buildhub/io.py buildhub/receipt.py buildhub/recovery.py
          buildhub/runner.py buildhub/payload.py buildhub/package.py
          buildhub/execution.py buildhub/doctor.py buildhub/heartbeat.py

      - name: Verify package smoke test
        run: python -m buildhub.cli verify-package ci-buildhub.zip

      - name: Upload CI evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-${{ runner.os }}-${{ github.sha }}
          path: |
            ci-doctor.json
            ci-buildhub.zip
          if-no-files-found: error
          retention-days: 7
