name: Excellentia Student Gateway Audit

on:
  pull_request:
    paths:
      - 'excellentia-student/**'
      - '.github/workflows/excellentia-student-gateway-audit.yml'
  push:
    branches:
      - feat/excellentia-student-gateway
    paths:
      - 'excellentia-student/**'
      - '.github/workflows/excellentia-student-gateway-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: Syntax
        run: |
          node --check excellentia-student/app.js
          node --check excellentia-student/gateway-adapter.js
          node --check excellentia-student/sw.js
      - name: Corpus + official shell contract
        run: node excellentia-student/audit.mjs
