name: Excellentia Student Gateway Audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'excellentia-student/**'
      - '.github/workflows/excellentia-student-gateway-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: Syntax
        run: |
          node --check excellentia-student/app.js
          node --check excellentia-student/sw.js
          node --check excellentia-student/audit.mjs
      - name: Corpus and gateway audit
        run: node excellentia-student/audit.mjs
