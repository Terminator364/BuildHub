<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101828">
<title>Excellentia — Entrée Élève</title>
<style>
body{margin:0;background:#101828;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:grid;place-items:center;min-height:100vh}
main{width:min(92vw,520px);text-align:center}.logo{font-weight:900;letter-spacing:.12em;font-size:13px;color:#98a2b3}
h1{font-size:28px;margin:12px 0 8px}.card{background:#fff;color:#101828;border-radius:18px;padding:20px;margin-top:18px}
.spin{width:42px;height:42px;border:4px solid #d0d5dd;border-top-color:#101828;border-radius:50%;margin:4px auto 16px;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}p{color:#667085}.small{font-size:12px}.error{color:#b42318}button{background:#101828;color:#fff;border:0;border-radius:12px;padding:12px 16px;font-weight:700}
</style></head>
<body><main><div class="logo">EXCELLENTIA STUDY HUB</div><h1>Entrée Élève</h1>
<div class="card"><div class="spin"></div><b id="title">Recherche de la dernière version…</b><p id="msg">Connexion au canal stable.</p><button id="retry" hidden>Réessayer</button></div></main>
<script>
const POINTER='https://raw.githubusercontent.com/Terminator364/BuildHub/main/excellentia/latest.json';
const FALLBACK='https://html-preview.github.io/?url=https://github.com/Terminator364/BuildHub/blob/main/excellentia-student/index.html';
async function go(){
 const title=document.getElementById('title'),msg=document.getElementById('msg'),retry=document.getElementById('retry');
 retry.hidden=true; title.textContent='Recherche de la dernière version…'; msg.textContent='Connexion au canal stable.';
 try{
   const r=await fetch(POINTER+'?t='+Date.now(),{cache:'no-store'});
   if(!r.ok) throw new Error('pointer '+r.status);
   const j=await r.json();
   if(!/^https:\/\/html-preview\.github\.io\/\?url=https:\/\/github\.com\/Terminator364\/BuildHub\/blob\/main\/excellentia-student\/index\.html$/.test(j.url||'')) throw new Error('route invalid');
   localStorage.setItem('excellentia_last_public_url',j.url);
   title.textContent='Excellentia '+j.version+' prête';
   msg.textContent=j.questions.toLocaleString('fr-FR')+' questions · '+j.knowledge_units.toLocaleString('fr-FR')+' connaissances · '+j.timer_seconds+' s/question';
   location.replace(j.url);
 }catch(e){
   const saved=localStorage.getItem('excellentia_last_public_url')||FALLBACK;
   title.textContent='Mode de secours';
   msg.textContent='Le pointeur de mise à jour est indisponible. Ouverture de la dernière version connue…';
   setTimeout(()=>location.replace(saved),700);
   retry.hidden=false;retry.onclick=go;
 }
}
go();
</script></body></html>
